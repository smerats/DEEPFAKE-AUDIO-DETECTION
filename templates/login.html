<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AudioGuard - Login</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Roboto', sans-serif; }
body { height:100vh; display:flex; justify-content:center; align-items:center; background: linear-gradient(135deg, #6C63FF, #3F3D56); }
.card { background:#fff; border-radius:12px; box-shadow:0 12px 25px rgba(0,0,0,0.2); width:360px; padding:40px 30px; text-align:center; transition:0.3s; }
.card:hover { transform: translateY(-5px); }
.logo { font-size:32px; font-weight:bold; color:#6C63FF; margin-bottom:25px; }
h2 { color:#333; margin-bottom:30px; }
.input-group { position:relative; margin-bottom:25px; text-align:left; }
.input-group input { width:100%; padding:12px 15px; border-radius:8px; border:1px solid #ccc; outline:none; font-size:16px; transition:0.3s; }
.input-group input:focus { border-color:#6C63FF; box-shadow:0 0 8px rgba(108,99,255,0.3); }
.input-group label { position:absolute; top:12px; left:15px; color:#aaa; pointer-events:none; transition:0.3s; }
.input-group input:focus + label,
.input-group input:not(:placeholder-shown) + label { top:-10px; left:10px; font-size:12px; background:#fff; padding:0 5px; color:#6C63FF; }
.card button { width:100%; padding:12px; border:none; border-radius:8px; background:#6C63FF; color:#fff; font-size:16px; font-weight:500; cursor:pointer; transition:0.3s; }
.card button:hover { background:#5752d1; }
.footer { margin-top:20px; font-size:14px; color:#666; }
.footer a { color:#6C63FF; text-decoration:none; transition:0.3s; }
.footer a:hover { color:#5752d1; }
@media(max-width:400px){ .card { width:90%; padding:30px 20px; } }
</style>
</head>
<body>

<div class="card">
    <div class="logo">AudioGuard</div>
    <h2>Login</h2>
    <form method="POST">
        <div class="input-group">
            <input type="text" name="username" placeholder=" " required>
            <label>Username</label>
        </div>
        <div class="input-group">
            <input type="password" name="password" placeholder=" " required>
            <label>Password</label>
        </div>
        <button type="submit">Login</button>
    </form>
    <div class="footer">Don't have an account? <a href="{{ url_for('signup') }}">Sign Up</a></div>
</div>

</body>
</html>
