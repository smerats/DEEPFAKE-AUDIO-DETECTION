<!DOCTYPE html>
<html>
<head>
    <title>History</title>
</head>
<body>

<h2>Prediction History</h2>

<table border="1">
    <tr>
        <th>ID</th>
        <th>Filename</th>
        <th>Prediction</th>
        <th>Confidence</th>
    </tr>

    {% for row in data %}
    <tr>
        <td>{{ row[0] }}</td>
        <td>{{ row[1] }}</td>
        <td>{{ row[2] }}</td>
        <td>{{ row[3] }}%</td>
    </tr>
    {% endfor %}

</table>

</body>
</html>
